# Publishes the static prototype in dist/ to GitHub Pages.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
# If a run fails because Pages was not yet enabled, re-run it from the Actions tab
# after enabling; no new commit is needed.
name: Deploy prototype to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["dist/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
